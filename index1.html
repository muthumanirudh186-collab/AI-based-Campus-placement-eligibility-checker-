<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Placement Eligibility Checker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --danger: #ef4444;
      --radius: 12px;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); background: #ffffff; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
    .brand { font-weight: 700; font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .nav-links a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); font-weight: 600; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 24px 80px; width: 100%; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .card h2 { font-size: 14px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; letter-spacing: 0.5px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    button { background: var(--accent); color: #ffffff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.15s; margin-top: 12px; }
    button:hover { background: var(--accent-hover); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 20px 0; }
    .stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
    .stat-box .num { font-size: 26px; font-weight: 700; color: var(--accent); }
    .stat-box .label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .company-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .tag { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--accent-light); color: var(--accent); }
    .chat { display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding: 8px; }
    .bubble { padding: 12px 16px; border-radius: 10px; max-width: 85%; font-size: 14px; }
    .bubble.q { background: var(--panel-2); color: var(--text); align-self: flex-start; }
    .bubble.a { background: var(--accent); color: #ffffff; align-self: flex-end; }
    .notice { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .notice.info { background: var(--accent-light); color: var(--accent); border: 1px solid rgba(37,99,235,0.2); }
    .notice.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; border-top: 1px solid var(--border); background: var(--panel); margin-top: auto; }
  </style>
</head>
<body>

<nav>
  <div class="brand" onclick="showView('checker')"><span class="dot"></span> Placement Checker</div>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="wrap">
  <div id="msg"></div>

  <!-- Auth View -->
  <div id="view-auth" class="card" style="max-width:400px;margin:40px auto;display:none;">
    <h2 id="auth-title">Login</h2>
    <div id="auth-extra" style="display:none;">
      <label>Full Name</label><input id="reg-name">
    </div>
    <label>Email</label><input id="auth-email" type="email">
    <label>Password</label><input id="auth-password" type="password">
    <div id="reg-fields" style="display:none;">
      <label>Branch</label>
      <select id="reg-branch"><option>CSE</option><option>AI</option><option>DS</option><option>IT</option><option>ECE</option></select>
      <label>CGPA</label><input id="reg-cgpa" type="number" step="0.1">
      <label>Backlogs</label><input id="reg-backlogs" type="number" value="0">
      <label>Skills</label><input id="reg-skills" placeholder="Java, SQL, DSA">
    </div>
    <button style="width:100%" onclick="handleAuthSubmit()">Submit</button>
    <p style="margin-top:14px;font-size:13px;color:var(--muted);text-align:center;">
      <a href="#" onclick="toggleAuthMode(); return false;" id="auth-toggle-btn" style="color:var(--accent)">Need an account? Register</a>
    </p>
  </div>

  <!-- Checker View -->
  <div id="view-checker" style="display:none;">
    <div class="card">
      <h2>Check Eligibility</h2>
      <label>Branch</label>
      <select id="chk-branch"><option>CSE</option><option>AI</option><option>DS</option><option>IT</option><option>ECE</option></select>
      <label>CGPA</label><input id="chk-cgpa" type="number" step="0.1" value="8.0">
      <label>Backlogs</label><input id="chk-backlogs" type="number" value="0">
      <label>Skills (comma separated)</label><input id="chk-skills" value="Java, Python, DSA">
      <button onclick="checkEligibility()">Check Companies</button>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="num" id="st-eligible">0</div><div class="label">Eligible</div></div>
      <div class="stat-box"><div class="num" id="st-not">0</div><div class="label">Not Eligible</div></div>
    </div>
    <div class="card">
      <h2>Eligible Companies</h2>
      <div id="eligible-list"></div>
    </div>
  </div>

  <!-- Mock Interview View -->
  <div id="view-interview" class="card" style="display:none;">
    <h2>AI Mock Interview</h2>
    <div class="chat" id="chat-box"></div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <input id="chat-input" placeholder="Type your answer...">
      <button onclick="submitAnswer()">Submit</button>
    </div>
  </div>
</div>

<footer>AI Placement Eligibility Checker &middot; Full-Stack Application</footer>

<script>
  // Set your backend API URL here if hosted separately (e.g., Render, Railway, Vercel)
  // Leave as empty string "" if served from the same Express backend domain
  const API_BASE_URL = "";

  let token = localStorage.getItem('token');
  let user = JSON.parse(localStorage.getItem('user') || 'null');
  let isRegister = false;
  let currentQuestions = [];
  let qIndex = 0;

  function updateNav() {
    const nav = document.getElementById('nav-links');
    if (!token) {
      nav.innerHTML = '<a onclick="showView(\'auth\')">Login</a>';
    } else {
      nav.innerHTML = `
        <a onclick="showView('checker')">Checker</a>
        <a onclick="startInterview()">Mock Interview</a>
        <a onclick="logout()">Logout (${user ? user.name : 'User'})</a>
      `;
    }
  }

  function showView(view) {
    document.getElementById('view-auth').style.display = view === 'auth' ? 'block' : 'none';
    document.getElementById('view-checker').style.display = view === 'checker' ? 'block' : 'none';
    document.getElementById('view-interview').style.display = view === 'interview' ? 'block' : 'none';
  }

  function toggleAuthMode() {
    isRegister = !isRegister;
    document.getElementById('auth-title').innerText = isRegister ? 'Register' : 'Login';
    document.getElementById('auth-extra').style.display = isRegister ? 'block' : 'none';
    document.getElementById('reg-fields').style.display = isRegister ? 'block' : 'none';
    document.getElementById('auth-toggle-btn').innerText = isRegister ? 'Already registered? Login' : 'Need an account? Register';
  }

  async function handleAuthSubmit() {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
    const body = { email, password };

    if (isRegister) {
      body.name = document.getElementById('reg-name').value;
      body.branch = document.getElementById('reg-branch').value;
      body.cgpa = document.getElementById('reg-cgpa').value;
      body.backlogs = document.getElementById('reg-backlogs').value;
      body.skills = document.getElementById('reg-skills').value;
    }

    try {
      const res = await fetch(API_BASE_URL + endpoint, { 
        method: 'POST', 
        headers: {'Content-Type':'application/json'}, 
        body: JSON.stringify(body) 
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      token = data.token;
      user = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(user));
      updateNav();
      showView('checker');
    } catch (err) {
      alert(err.message);
    }
  }

  function logout() {
    localStorage.clear();
    token = null; 
    user = null;
    updateNav();
    showView('auth');
  }

  async function checkEligibility() {
    const body = {
      branch: document.getElementById('chk-branch').value,
      cgpa: document.getElementById('chk-cgpa').value,
      backlogs: document.getElementById('chk-backlogs').value,
      skills: document.getElementById('chk-skills').value.split(',').map(s=>s.trim())
    };

    try {
      const res = await fetch(API_BASE_URL + '/api/companies/eligibility', { 
        method: 'POST', 
        headers: {'Content-Type':'application/json'}, 
        body: JSON.stringify(body) 
      });
      const data = await res.json();

      document.getElementById('st-eligible').innerText = data.eligibleCount || 0;
      document.getElementById('st-not').innerText = data.notEligibleCount || 0;
      document.getElementById('eligible-list').innerHTML = (data.eligible || []).map(c => `
        <div class="company-row">
          <div><strong>${c.name}</strong> <span style="color:var(--muted);font-size:12px;">(${c.category})</span></div>
          <span class="tag">₹${c.package_lpa} LPA</span>
        </div>
      `).join('') || '<p style="color:var(--muted)">No eligible companies found.</p>';
    } catch (err) {
      alert("Error checking eligibility. Is the backend running?");
    }
  }

  async function startInterview() {
    showView('interview');
    try {
      const res = await fetch(API_BASE_URL + '/api/interview/start?count=3', { 
        headers: { 'Authorization': 'Bearer ' + token } 
      });
      const data = await res.json();
      currentQuestions = data.questions || [];
      qIndex = 0;
      document.getElementById('chat-box').innerHTML = '';
      askNext();
    } catch (err) {
      alert("Error starting interview.");
    }
  }

  function askNext() {
    if (qIndex >= currentQuestions.length) {
      addBubble("Interview complete! Great job.", "q");
      return;
    }
    addBubble(`Q${qIndex+1}: ${currentQuestions[qIndex].question}`, "q");
  }

  function addBubble(text, type) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'bubble ' + type;
    div.innerText = text;
    box.appendChild(div);
  }

  async function submitAnswer() {
    const input = document.getElementById('chat-input');
    const val = input.value.trim();
    if (!val) return;

    addBubble(val, 'a');
    input.value = '';

    const q = currentQuestions[qIndex];
    try {
      const res = await fetch(API_BASE_URL + '/api/interview/evaluate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ questionId: q.id, answer: val })
      });
      const data = await res.json();
      addBubble(`Score: ${data.score}/100 — ${data.feedback}`, 'q');
      qIndex++;
      setTimeout(askNext, 800);
    } catch (err) {
      addBubble("Failed to evaluate answer. Try again.", "q");
    }
  }

  // Initial load state
  updateNav();
  if (token) showView('checker'); else showView('auth');
</script>
</body>
  </html>
