<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="brand"><span class="dot"></span> Placement Checker</div>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="wrap">
  <div class="hero">
    <h1>Admin panel</h1>
    <p>Manage the company dataset and view registered students. Admin accounts only.</p>
  </div>

  <div id="guard"></div>

  <div class="card">
    <h2>Add a company</h2>
    <label>Name</label>
    <input id="c-name" placeholder="Company name">
    <label>Category</label>
    <input id="c-category" placeholder="e.g. IT Services, Product, Core Engineering">
    <label>Minimum CGPA</label>
    <input id="c-cgpa" type="number" step="0.1">
    <label>Max backlogs allowed</label>
    <input id="c-backlogs" type="number">
    <label>Eligible branches (comma separated)</label>
    <input id="c-branch" placeholder="CSE, IT, AI">
    <label>Required skills (comma separated)</label>
    <input id="c-skills" placeholder="Java, SQL">
    <label>Package (LPA)</label>
    <input id="c-package" type="number" step="0.1">
    <button style="margin-top:18px" onclick="addCompany()">Add company</button>
  </div>

  <div class="stats">
    <div class="stat-box"><div class="num" id="total-companies">0</div><div class="label">Companies</div></div>
    <div class="stat-box"><div class="num" id="total-students">0</div><div class="label">Registered Students</div></div>
  </div>

  <div class="card">
    <h2>Companies</h2>
    <input id="search" placeholder="Search companies..." onkeyup="renderCompanies()">
    <div id="companies" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <h2>Students</h2>
    <div id="students" style="color:var(--muted)">Loading...</div>
  </div>
</div>

<footer>AI Placement Eligibility Checker &middot; Admin Panel</footer>

<script src="js/api.js"></script>
<script>
requireLogin();
renderNav("admin");

let allCompanies = [];

(function guardAdmin() {
  const user = getUser();
  if (!user || user.role !== "admin") {
    document.getElementById("guard").innerHTML =
      `<div class="notice error">This page is for admin accounts only. <a href="index.html" style="color:var(--accent)">Go back</a></div>`;
    document.querySelectorAll(".card").forEach(c => c.style.display = "none");
  }
})();

async function loadAll() {
  const companiesData = await api("/companies");
  allCompanies = companiesData.companies;
  document.getElementById("total-companies").innerHTML = allCompanies.length;
  renderCompanies();

  try {
    const studentsData = await api("/admin/students");
    document.getElementById("total-students").innerHTML = studentsData.count;
    document.getElementById("students").innerHTML = studentsData.students.length === 0
      ? "<p>No students registered yet.</p>"
      : `<table>
          <tr><th>Name</th><th>Email</th><th>Branch</th><th>CGPA</th><th>Backlogs</th></tr>
          ${studentsData.students.map(s => `
            <tr><td>${s.name}</td><td>${s.email}</td><td>${s.branch || "-"}</td><td>${s.cgpa ?? "-"}</td><td>${s.backlogs ?? 0}</td></tr>
          `).join("")}
        </table>`;
  } catch (err) {
    document.getElementById("students").innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

function renderCompanies() {
  const text = (document.getElementById("search")?.value || "").toLowerCase();
  const filtered = allCompanies.filter(c => c.name.toLowerCase().includes(text));

  document.getElementById("companies").innerHTML = filtered.map(c => `
    <div class="company-row">
      <div>
        <div class="name">${c.name}</div>
        <div class="meta">CGPA ≥ ${c.cgpa} · Backlogs ≤ ${c.backlogs} · Branches: ${c.branch.join(", ")}</div>
      </div>
      <div>
        <span class="tag">₹${c.package_lpa} LPA</span>
        <button class="danger" style="margin-left:10px;padding:6px 10px;font-size:12px" onclick="deleteCompany('${c._id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function addCompany() {
  const body = {
    name: document.getElementById("c-name").value,
    category: document.getElementById("c-category").value || "IT Services",
    cgpa: parseFloat(document.getElementById("c-cgpa").value),
    backlogs: parseInt(document.getElementById("c-backlogs").value) || 0,
    branch: document.getElementById("c-branch").value.split(",").map(s => s.trim()).filter(Boolean),
    skills: document.getElementById("c-skills").value.split(",").map(s => s.trim()).filter(Boolean),
    package_lpa: parseFloat(document.getElementById("c-package").value),
  };

  try {
    await api("/admin/companies", { method: "POST", body });
    await loadAll();
  } catch (err) {
    alert(err.message);
  }
}

async function deleteCompany(id) {
  if (!confirm("Remove this company?")) return;
  try {
    await api("/admin/companies/" + id, { method: "DELETE" });
    await loadAll();
  } catch (err) {
    alert(err.message);
  }
}

if (getUser()?.role === "admin") loadAll();
</script>
</body>
</html>
