                </div>
                <div>
                  <h1 className="text-lg font-black text-brand-950 tracking-tight leading-tight">

                    <p className="text-xs text-slate-300">Customized preparation roadmaps tailored for Indian campus placement drives.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                    <div className="p-3 bg-brand-100 text-brand-600 rounded-2xl w-fit">
                      <i data-lucide="code" class="w-6 h-6"></i>
                    </div>
                    <h3 className="font-extrabold text-slate-900 text-base">Super Dream Strategy (&gt;12L)</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Target companies like Google, Amazon, and Microsoft. Requires solving 250+ DSA problems in Trees, Graphs, DP, and System Design basics.
                    </p>
                  </div>

                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                    <div className="p-3 bg-cyan-100 text-cyan-600 rounded-2xl w-fit">
                      <i data-lucide="cpu" class="w-6 h-6"></i>
                    </div>
                    <h3 className="font-extrabold text-slate-900 text-base">Dream Company Strategy (6-12L)</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Target firms like Deloitte, TCS Digital, and Infosys Power Programmer. Focus heavily on SQL Joins, OOPs principles, Python/C++, and Aptitude.
                    </p>
                  </div>

                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3">
                    <div className="p-3 bg-emerald-100 text-emerald-600 rounded-2xl w-fit">
                      <i data-lucide="award" class="w-6 h-6"></i>
                    </div>
                    <h3 className="font-extrabold text-slate-900 text-base">Mass Recruiter Strategy</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Target TCS Ninja, Accenture ASE, and Cognizant GenC. Practice speed aptitude tests, pseudo-code analysis, basic C programming, and clear HR rounds.
                    </p>
                  </div>

                </div>
              </div>
            )}

            {/* ================= TAB 5: AI LIVE MOCK INTERVIEW ================= */}
            {activeTab === 'interview' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-6">
                  <div className="border-b border-slate-100 pb-4">
                    <h2 className="text-xl font-black text-slate-900">AI Live Mock Technical Interview Simulator</h2>
                    <p className="text-xs text-slate-500">Practice real technical interview prompts with instant AI answer feedback</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    <!-- Question Selection list -->
                    <div className="lg:col-span-5 space-y-3">
                      <label className="block text-xs font-bold text-slate-700">Select Target Technical Drive:</label>
                      {mockInterviews.map((m, idx) => (
                        <div 
                          key={m.id} 
                          onClick={() => { setSelectedMockIndex(idx); setAiMockFeedback(null); setUserMockAnswer(''); }}
                          className={`p-4 rounded-2xl border cursor-pointer transition ${
                            selectedMockIndex === idx ? 'bg-brand-50 border-brand-500 shadow-sm' : 'bg-slate-50 border-slate-200 hover:bg-white'
                          }`}
                        >
                          <span className="text-[10px] font-extrabold px-2 py-0.5 rounded bg-brand-100 text-brand-700">
                            {m.company}
                          </span>
                          <h4 className="font-bold text-xs text-slate-900 mt-2">{m.topic}</h4>
                        </div>
                      ))}
                    </div>

                    <!-- Interview Workspace -->
                    <div className="lg:col-span-7 space-y-4">
                      <div className="bg-slate-900 text-white p-4 rounded-2xl space-y-2">
                        <span className="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">AI Interviewer Prompt:</span>
                        <p className="text-xs font-semibold leading-relaxed">
                          "{mockInterviews[selectedMockIndex].prompt}"
                        </p>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Your Explanation / Approach Code:</label>
                        <textarea 
                          rows={5} 
                          value={userMockAnswer} 
                          onChange={e => setUserMockAnswer(e.target.value)}
                          placeholder="Type your explanation, time complexity, or code solution here..."
                          className="w-full bg-slate-50 border border-slate-300 rounded-2xl p-3 text-xs font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>

                      <button 
                        onClick={handleEvaluateMock} 
                        disabled={isEvaluatingMock || !userMockAnswer.trim()}
                        className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2"
                      >
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        {isEvaluatingMock ? 'Evaluating Solution...' : 'Submit to AI Evaluator'}
                      </button>

                      {aiMockFeedback && (
                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-xs space-y-2">
                          <div className="flex items-center justify-between border-b border-emerald-200 pb-2">
                            <span className="font-extrabold text-emerald-900">Evaluation Score: {aiMockFeedback.score}/10</span>
                            <span className="px-2 py-0.5 rounded bg-emerald-200 text-emerald-900 font-bold">{aiMockFeedback.verdict}</span>
                          </div>
                          <p className="text-emerald-800"><strong>Strengths:</strong> {aiMockFeedback.strengths}</p>
                          <p className="text-emerald-800"><strong>Areas to Improve:</strong> {aiMockFeedback.improvements}</p>
                        </div>
                      )}
                    </div>

                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB 6: LIVE PYQS PRACTICE ================= */}
            {activeTab === 'pyqTest' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-5">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                      <h2 className="text-xl font-black text-slate-900">Live Campus PYQ Practice Test</h2>
                      <p className="text-xs text-slate-500">Practice questions asked in recent technical assessment rounds</p>
                    </div>
                    <span className="px-3 py-1 bg-brand-100 text-brand-800 text-xs font-bold rounded-xl">
                      {pyqQuestions.length} Questions
                    </span>
                  </div>

                  {!pyqFinished ? (
                    <div className="space-y-4">
                      <span className="text-xs font-bold uppercase text-brand-600">
                        Question {currentPyqIndex + 1} of {pyqQuestions.length}
                      </span>
                      <h3 className="text-sm font-bold text-slate-900 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                        {pyqQuestions[currentPyqIndex].q}
                      </h3>

                      <div className="space-y-2">
                        {pyqQuestions[currentPyqIndex].options.map((opt, idx) => (
                          <button
                            key={idx}
                            onClick={() => setSelectedPyqOpt(idx)}
                            className={`w-full text-left p-3.5 rounded-xl border text-xs font-semibold transition ${
                              selectedPyqOpt === idx 
                                ? 'bg-brand-50 border-brand-500 text-brand-900 shadow-sm' 
                                : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                            }`}
                          >
                            <span className="inline-block w-6 text-slate-400 font-bold">{String.fromCharCode(65 + idx)}.</span>
                            {opt}
                          </button>
                        ))}
                      </div>

                      <div className="flex justify-end pt-3">
                        <button
                          disabled={selectedPyqOpt === null}
                          onClick={() => {
                            if (selectedPyqOpt === pyqQuestions[currentPyqIndex].ans) {
                              setPyqScore(s => s + 1);
                            }
                            if (currentPyqIndex < pyqQuestions.length - 1) {
                              setCurrentPyqIndex(i => i + 1);
                              setSelectedPyqOpt(null);
                            } else {
                              setPyqFinished(true);
                            }
                          }}
                          className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-md transition"
                        >
                          {currentPyqIndex === pyqQuestions.length - 1 ? 'Finish Assessment' : 'Next Question'}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-8 space-y-3">
                      <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto border border-emerald-200">
                        <i data-lucide="award" class="w-8 h-8"></i>
                      </div>
                      <h3 className="text-2xl font-black text-slate-900">Test Completed!</h3>
                      <p className="text-xs font-semibold text-slate-600">
                        You scored <strong className="text-brand-600 text-base">{pyqScore}</strong> out of {pyqQuestions.length}
                      </p>
                      <button
                        onClick={() => { setPyqFinished(false); setCurrentPyqIndex(0); setSelectedPyqOpt(null); setPyqScore(0); }}
                        className="px-5 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl hover:bg-brand-700 transition"
                      >
                        Retake Practice Test
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ================= TAB 7: INTERVIEW EXPERIENCES VAULT ================= */}
            {activeTab === 'experiences' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                  <div>
                    <h2 className="text-xl font-black text-slate-900">Company Interview Experience Vault</h2>
                    <p className="text-xs text-slate-500">Real feedback and round details shared by seniors</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {INTERVIEW_EXPERIENCES.map((exp, idx) => (
                      <div key={idx} className="bg-slate-50 rounded-2xl border border-slate-200 p-5 space-y-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-extrabold text-slate-900 text-sm">{exp.company}</h3>
                            <p className="text-xs font-bold text-brand-600">{exp.role}</p>
                          </div>
                          <span className="px-2.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200">
                            {exp.difficulty}
                          </span>
                        </div>

                        <div className="space-y-1 text-xs text-slate-600">
                          <p><strong>Rounds:</strong> {exp.rounds}</p>
                          <p><strong>Key Focus Topics:</strong> {exp.topics}</p>
                          <p className="bg-white p-3 rounded-xl border border-slate-200 mt-2 italic text-slate-700">
                            "{exp.experience}"
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB 8: CTC BREAKDOWN CALCULATOR ================= */}
            {activeTab === 'ctcCalc' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-5">
                  <div>
                    <h2 className="text-xl font-black text-slate-900">CTC & In-Hand Salary Breakdown Calculator</h2>
                    <p className="text-xs text-slate-500">Calculate realistic monthly take-home salary from annual CTC offer letters</p>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Offered Annual CTC (LPA)</label>
                      <input 
                        type="number" step="0.5" min="1" 
                        value={ctcInput} onChange={e => setCtcInput(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    {parseFloat(ctcInput) > 0 && (
                      <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3 text-xs">
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-600">Estimated Base Component (70%):</span>
                          <span className="font-bold text-slate-900">₹{(parseFloat(ctcInput) * 0.7).toFixed(2)} LPA</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-600">Performance Bonus & ESOPs (20%):</span>
                          <span className="font-bold text-slate-900">₹{(parseFloat(ctcInput) * 0.2).toFixed(2)} LPA</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-600">PF & Gratuity Deductions (10%):</span>
                          <span className="font-bold text-slate-900">₹{(parseFloat(ctcInput) * 0.1).toFixed(2)} LPA</span>
                        </div>
                        <div className="flex justify-between bg-emerald-100 p-3 rounded-xl border border-emerald-200 text-emerald-900 font-extrabold text-sm">
                          <span>Estimated Monthly In-Hand:</span>
                          <span>₹{Math.round((parseFloat(ctcInput) * 100000 * 0.7) / 12).toLocaleString()} / month</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ================= TAB 9: ADMIN PORTAL ================= */}
            {activeTab === 'admin' && (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white rounded-3xl p-6 shadow-xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <span className="px-3 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/30">
                      ADMINISTRATOR PRIVILEGES
                    </span>
                    <h2 className="text-2xl font-black mt-1">Placement Cell Management Console</h2>
                    <p className="text-xs text-slate-300">Add recruiting drives and control company cutoff criteria.</p>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-slate-400 block">Total Database Size</span>
                    <span className="text-2xl font-black text-cyan-400">{companiesList.length} Companies</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  
                  <!-- Form to add company -->
                  <div className="lg:col-span-5 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 className="font-extrabold text-slate-900 text-base border-b border-slate-100 pb-3">
                      Publish New Recruiting Drive
                    </h3>

                    {adminNotice && (
                      <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl font-bold">
                        {adminNotice}
                      </div>
                    )}

                    <form onSubmit={handleAddCompany} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Company Name</label>
                        <input 
                          type="text" required 
                          value={newCompName} onChange={e => setNewCompName(e.target.value)} 
                          placeholder="e.g. Cisco Systems India" 
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Target Designation / Role</label>
                        <input 
                          type="text" required 
                          value={newCompRole} onChange={e => setNewCompRole(e.target.value)} 
                          placeholder="e.g. Technical Engineer Trainee" 
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">CTC Package (LPA)</label>
                          <input 
                            type="number" step="0.1" required 
                            value={newCompCtc} onChange={e => setNewCompCtc(e.target.value)} 
                            placeholder="e.g. 14.5" 
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Tier Category</label>
                          <select 
                            value={newCompTier} onChange={e => setNewCompTier(e.target.value)} 
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                          >
                            <option value="Super Dream">Super Dream (&gt;12L)</option>
                            <option value="Dream">Dream (6-12L)</option>
                            <option value="Mass">Mass Recruiters</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Min. Cutoff CGPA</label>
                        <input 
                          type="number" step="0.1" required 
                          value={newCompMinCgpa} onChange={e => setNewCompMinCgpa(e.target.value)} 
                          placeholder="e.g. 7.5" 
                          className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>

                      <button type="submit" className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl transition shadow-md">
                        Publish Drive to Live Database
                      </button>
                    </form>
                  </div>

                  <!-- Quick Stats & Overview -->
                  <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 className="font-extrabold text-slate-900 text-base border-b border-slate-100 pb-3">
                      Live Database Records Overview
                    </h3>

                    <div className="max-h-80 overflow-y-auto space-y-2 pr-1">
                      {companiesList.slice(0, 10).map((c, i) => (
                        <div key={i} className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                          <div>
                            <p className="font-bold text-slate-900">{c.name}</p>
                            <p className="text-[10px] text-slate-500">{c.role} • Min CGPA: {c.minCgpa}</p>
                          </div>
                          <span className="font-black text-emerald-600">₹{c.ctc} LPA</span>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            )}

          </main>

          <!-- AUTH MODAL -->
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-slate-200 p-6 max-w-md w-full shadow-2xl relative space-y-4">
                <button 
                  onClick={() => setShowLoginModal(false)}
                  className="absolute right-4 top-4 text-slate-400 hover:text-slate-600 p-1"
                >
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <div className="text-center">
                  <div className="w-12 h-12 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="lock" class="w-6 h-6"></i>
                  </div>
                  <h3 className="text-xl font-black text-slate-900">Portal Login</h3>
                  <p className="text-xs text-slate-500">Switch role between Candidate and Admin</p>
                </div>

                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button 
                    onClick={() => setLoginRole('student')} 
                    className={`flex-1 py-2 rounded-lg transition ${loginRole === 'student' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'}`}
                  >
                    Student
                  </button>
                  <button 
                    onClick={() => setLoginRole('admin')} 
                    className={`flex-1 py-2 rounded-lg transition ${loginRole === 'admin' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'}`}
                  >
                    Placement Officer (Admin)
                  </button>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Email / Student ID</label>
                    <input 
                      type="text" required 
                      value={loginEmail} onChange={e => setLoginEmail(e.target.value)}
                      placeholder={loginRole === 'admin' ? "admin@placement.edu.in" : "candidate@college.edu.in"} 
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                    <input 
                      type="password" required 
                      value={loginPassword} onChange={e => setLoginPassword(e.target.value)}
                      placeholder="••••••••" 
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <button type="submit" className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Sign In as {loginRole === 'admin' ? 'Admin' : 'Student'}
                  </button>
                </form>
              </div>
            </div>
          )}

          <!-- FOOTER -->
          <footer className="bg-white border-t border-slate-200 py-6 px-4 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <p className="font-semibold text-slate-600">
                AI Placement Eligibility Checker and Advisor &copy; 2026. All rights reserved.
              </p>
              <p className="text-[11px] text-slate-400">
                India's Verified 590+ Companies Placement Intelligence System
              </p>
            </div>
          </footer>

        </div>
      );
    }

    // Render Root Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
