    const shuffleMCQ = (correct, distractors) => {
      const vals = [correct, ...distractors];
      for (let i = vals.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [vals[i], vals[j]] = [vals[j], vals[i]];
      }
      return { options: vals, ans: vals.indexOf(correct) };
    };

    const PYQ_TEMPLATES = [
      (s) => {
        const sp = 40 + (s % 60), t = 5 + (s % 10), dist = Math.round(sp * (1000 / 3600) * t);
        const r = shuffleMCQ(`${dist} meters`, [`${dist + 20} meters`, `${dist - 15} meters`, `${dist + 35} meters`]);
        return { category: 'Aptitude & Speed Math', q: `A train running at ${sp} km/hr crosses a pole in ${t} seconds. Find the length of the train.`, options: r.options, ans: r.ans, explanation: `Speed in m/s = ${sp} * (5/18). Distance = Speed * Time = ${dist} m.` };
      },
      (s) => {
        const algos = ["Quick Sort", "Merge Sort", "Binary Search", "Heap Sort", "DFS Traversal"];
        const comp = ["O(n log n)", "O(n log n)", "O(log n)", "O(n log n)", "O(V + E)"];
        const idx = s % algos.length;
        const r = shuffleMCQ(comp[idx], ["O(n²)", "O(n)", "O(1)", "O(2ⁿ)"].filter(x => x !== comp[idx]));
        return { category: 'DSA & Algorithms', q: `What is the average time complexity of ${algos[idx]}?`, options: r.options, ans: r.ans, explanation: `Standard algorithmic complexity for ${algos[idx]} is ${comp[idx]}.` };
      },
      (s) => {
        const sqlOps = [
          { q: "Which SQL clause filters records after an aggregate GROUP BY?", a: "HAVING", d: ["WHERE", "ORDER BY", "FILTER"] },
          { q: "Which command deletes all rows permanently without logging individual row operations?", a: "TRUNCATE", d: ["DELETE", "DROP", "ALTER"] },
          { q: "Which key uniquely identifies each record in a relational database table?", a: "Primary Key", d: ["Foreign Key", "Unique Key", "Super Key"] }
        ];
        const pick = sqlOps[s % sqlOps.length];
        const r = shuffleMCQ(pick.a, pick.d);
        return { category: 'DBMS & Database', q: pick.q, options: r.options, ans: r.ans, explanation: `${pick.a} is the standard SQL operator required for this operation.` };
      },
      (s) => {
        const branchQs = [
          { cat: 'Electronics & Embedded', q: 'Which micro-architecture handles interrupts fastest in RTOS?', a: 'Vectored Interrupt Controller', d: ['Polled I/O', 'Software Trap', 'DMA Engine'] },

          { cat: 'Civil & Structural', q: 'What is the minimum grade of concrete recommended for reinforced concrete in moderate exposure?', a: 'M20', d: ['M10', 'M15', 'M35'] }
        ];
        const pick = branchQs[s % branchQs.length];
        const r = shuffleMCQ(pick.a, pick.d);
        return { category: pick.cat, q: pick.q, options: r.options, ans: r.ans, explanation: `Correct standard technical answer is ${pick.a}.` };
      }
    ];

      let hash = 0;
      for (let i = 0; i < companyName.length; i++) hash = companyName.charCodeAt(i) + ((hash << 5) - hash);
      for (let k = 0; k < count; k++) {
        const seed = Math.abs(hash + k * 1009);
        const tmpl = PYQ_TEMPLATES[seed % PYQ_TEMPLATES.length];
        list.push({ id: `${companyName}-${k}`, company: companyName, ...tmpl(seed) });

                            onClick={() => setSelectedPyqOpt(oIdx)}
                            className={`w-full text-left p-3 rounded-xl border text-xs font-bold transition ${
                              selectedPyqOpt === oIdx 
                                ? oIdx === activePyq.ans ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : 'bg-rose-50 border-rose-400 text-rose-900'
                                : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                            }`}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>

                      {selectedPyqOpt !== null && (
                        <div className={`p-4 rounded-2xl text-xs font-semibold ${selectedPyqOpt === activePyq.ans ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}`}>
                          <p className="font-bold">{selectedPyqOpt === activePyq.ans ? '✅ Correct Answer!' : '❌ Incorrect'}</p>
                          <p className="mt-1">{activePyq.explanation}</p>
                        </div>
                      )}

                      <div className="flex justify-between pt-2">
                        <button 
                          disabled={currentPyqIndex === 0} 
                          onClick={() => { setCurrentPyqIndex(i => i - 1); setSelectedPyqOpt(null); }}
                          className="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold disabled:opacity-40"
                        >
                          Previous
                        </button>
                        <button 
                          disabled={currentPyqIndex === companyPyqs.length - 1} 
                          onClick={() => { setCurrentPyqIndex(i => i + 1); setSelectedPyqOpt(null); }}
                          className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700"
                        >
                          Next Question
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 2: COMPETITIVE CELL (GOVT JOBS) */}
            {activeTab === 'govtJobs' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-cyan-900 via-brand-900 to-slate-900 rounded-3xl p-6 text-white shadow-xl">
                  <span className="px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">
                    COMPETITIVE CELL
                  </span>
                  <h2 className="text-2xl font-black mt-2">Government & Public Sector Jobs Available For {branch}</h2>
                  <p className="text-xs text-slate-300 mt-1">
                    Direct government exam notifications, GATE PSU recruitment, UPSC ESE, SSC JE, RRB JE, and ISRO/DRDO research scientist openings matched for your branch stream.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {getGovtJobsForBranch(branch).map((job, idx) => (
                    <div key={idx} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-2">
                      <div className="flex items-start justify-between">
                        <div>
                          <h3 className="font-black text-slate-900 text-sm">{job.title}</h3>
                          <p className="text-xs font-bold text-brand-600">{job.agency}</p>
                        </div>
                        <span className="px-2.5 py-1 bg-cyan-50 text-cyan-800 border border-cyan-200 font-extrabold text-[10px] rounded-lg">
                          Govt Officer
                        </span>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs space-y-1">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Eligibility Criteria:</span>
                          <span className="font-bold text-slate-800">{job.eligibility}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Pay Scale / Band:</span>
                          <span className="font-black text-emerald-600">{job.salary}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: READINESS SCORE */}
            {activeTab === 'readiness' && (
              <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                <h2 className="text-xl font-black text-slate-900">Placement Skill Readiness Score</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-3">
                    {Object.keys(skills).map(k => (
                      <div key={k} className="space-y-1">
                        <div className="flex justify-between text-xs font-bold text-slate-700 uppercase">
                          <span>{k}</span>
                          <span className="text-brand-600">{skills[k]}%</span>
                        </div>
                        <input 
                          type="range" min="0" max="100" value={skills[k]} 
                          onChange={e => setSkills({...skills, [k]: parseInt(e.target.value)})}
                          className="w-full accent-brand-600 h-2 bg-slate-100 rounded-lg"
                        />
                      </div>
                    ))}
                  </div>
                  <div className="bg-brand-50 border border-brand-200 p-6 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span className="text-4xl font-black text-brand-700">{readinessScore}%</span>
                    <span className="text-xs font-bold text-brand-900 uppercase mt-1">Calculated Placement Readiness</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: AI MOCK INTERVIEW */}
            {activeTab === 'interview' && (
              <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-6">
                <div>
                  <span className="px-2.5 py-1 bg-purple-100 text-purple-800 text-[10px] font-black rounded-lg uppercase">AI Evaluator</span>
                  <h2 className="text-xl font-black text-slate-900 mt-1">Interactive AI Mock Interview Simulation</h2>
                  <p className="text-xs text-slate-500">Practice real technical interview questions and receive instant automated assessment scores.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {mockInterviews.map((m, idx) => (
                    <button
                      key={m.id}
                      onClick={() => { setSelectedMockIndex(idx); setUserMockAnswer(''); setAiMockFeedback(null); }}
                      className={`p-4 rounded-2xl border text-left transition ${
                        selectedMockIndex === idx ? 'bg-purple-50 border-purple-400 text-purple-950' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      <p className="text-[10px] font-bold uppercase text-purple-700">{m.company}</p>
                      <p className="text-xs font-black mt-1">{m.topic}</p>
                    </button>
                  ))}
                </div>

                <div className="bg-slate-50 border border-slate-200 p-5 rounded-2xl space-y-4">
                  <div>
                    <h3 className="text-xs font-bold text-slate-500 uppercase">Interview Question</h3>
                    <p className="font-black text-slate-900 text-sm mt-1">{mockInterviews[selectedMockIndex].prompt}</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Your Technical Explanation / Pseudo Code</label>
                    <textarea 
                      rows="5"
                      value={userMockAnswer}
                      onChange={e => setUserMockAnswer(e.target.value)}
                      placeholder="Type your structured solution step-by-step here..."
                      className="w-full bg-white border border-slate-300 rounded-xl p-3 text-xs font-mono focus:ring-2 focus:ring-purple-500"
                    ></textarea>
                  </div>

                  <button
                    onClick={handleEvaluateMock}
                    disabled={isEvaluatingMock || !userMockAnswer.trim()}
                    className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center gap-2"
                  >
                    {isEvaluatingMock ? 'Analyzing Response...' : 'Submit Response For AI Feedback'}
                  </button>

                  {aiMockFeedback && (
                    <div className="bg-purple-50 border border-purple-200 p-4 rounded-xl text-xs space-y-2 text-purple-950">
                      <div className="flex justify-between items-center border-b border-purple-200 pb-2">
                        <span className="font-extrabold">Evaluation Result: {aiMockFeedback.verdict}</span>
                        <span className="font-black text-sm text-purple-700">{aiMockFeedback.score} / 10 Score</span>
                      </div>
                      <p><strong>Key Strengths:</strong> {aiMockFeedback.strengths}</p>
                      <p><strong>Areas for Improvement:</strong> {aiMockFeedback.improvements}</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: INTERVIEW VAULT */}
            {activeTab === 'experiences' && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                  <h2 className="text-xl font-black text-slate-900">Student Interview Experience Vault</h2>
                  <p className="text-xs text-slate-500">Real feedback, question topics, and tips shared by recently placed seniors.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {INTERVIEW_EXPERIENCES.map((exp, idx) => (
                    <div key={idx} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-black text-slate-900 text-sm">{exp.company}</h3>
                          <p className="text-xs font-bold text-brand-600">{exp.role}</p>
                        </div>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-800 border border-slate-200">
                          {exp.difficulty}
                        </span>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs space-y-1">
                        <p><strong>Rounds:</strong> {exp.rounds}</p>
                        <p><strong>Key Topics Asked:</strong> {exp.topics}</p>
                      </div>
                      <p className="text-xs text-slate-600 leading-relaxed italic">"{exp.experience}"</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: CTC CALCULATOR */}
            {activeTab === 'ctcCalc' && (
              <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-6 max-w-2xl mx-auto">
                <div>
                  <h2 className="text-xl font-black text-slate-900">CTC vs Take-Home Salary Breakdown Calculator</h2>
                  <p className="text-xs text-slate-500">Understand the realistic monthly in-hand salary distribution for your offer.</p>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Offered Annual CTC (LPA In ₹ Lakhs)</label>
                    <input 
                      type="number" step="0.5" value={ctcInput} 
                      onChange={e => setCtcInput(e.target.value)} 
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-slate-900 focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  {(() => {
                    const totalCtc = (parseFloat(ctcInput) || 0) * 100000;
                    const basePay = totalCtc * 0.50;
                    const hra = totalCtc * 0.20;
                    const pfDeduction = Math.min(basePay * 0.12, 21600);
                    const perfBonus = totalCtc * 0.15;
                    const estimatedTax = totalCtc > 700000 ? (totalCtc - 700000) * 0.10 : 0;
                    const annualTakeHome = Math.max(0, totalCtc - pfDeduction - estimatedTax - perfBonus);
                    const monthlyInHand = Math.round(annualTakeHome / 12);

                    return (
                      <div className="space-y-3 border-t border-slate-100 pt-4">
                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center">
                          <span className="text-xs font-extrabold text-emerald-800 uppercase block">Estimated Monthly Take-Home</span>
                          <span className="text-3xl font-black text-emerald-700 mt-1 block">₹{monthlyInHand.toLocaleString('en-IN')} / month</span>
                        </div>

                        <div className="space-y-1.5 text-xs text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100">
                          <div className="flex justify-between"><span>Base Pay (Annual):</span><span className="font-bold text-slate-900">₹{basePay.toLocaleString('en-IN')}</span></div>
                          <div className="flex justify-between"><span>House Rent Allowance (HRA):</span><span className="font-bold text-slate-900">₹{hra.toLocaleString('en-IN')}</span></div>
                          <div className="flex justify-between"><span>Variable Performance Bonus (Year-End):</span><span className="font-bold text-slate-900">₹{perfBonus.toLocaleString('en-IN')}</span></div>
                          <div className="flex justify-between"><span>Provident Fund (PF Deduction):</span><span className="font-bold text-rose-600">- ₹{pfDeduction.toLocaleString('en-IN')}</span></div>
                          <div className="flex justify-between"><span>Estimated Income Tax (TDS):</span><span className="font-bold text-rose-600">- ₹{estimatedTax.toLocaleString('en-IN')}</span></div>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* TAB: ADMIN PORTAL */}
            {activeTab === 'admin' && currentUser.role === 'admin' && (
              <div className="space-y-6">
                <div className="bg-slate-900 rounded-3xl p-6 text-white shadow-xl space-y-2">
                  <span className="px-3 py-1 bg-rose-500/20 text-rose-300 border border-rose-400/30 text-xs font-bold rounded-full">ADMIN PORTAL</span>
                  <h2 className="text-2xl font-black">Placement Officer Dashboard</h2>
                  <p className="text-xs text-slate-300">Publish new recruitment drives, manage coordinator permissions, and post notices.</p>
                </div>

                {adminNotice && (
                  <div className="p-4 bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs font-bold rounded-2xl">
                    {adminNotice}
                  </div>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Create New Drive */}
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 className="font-extrabold text-slate-900 text-sm border-b border-slate-100 pb-3">Publish New Placement Drive</h3>
                    <form onSubmit={handleAddCompany} className="space-y-3">
                      <div>
                        <label className="block text-[10px] font-bold text-slate-700 mb-1">Company Name</label>
                        <input type="text" required value={newCompName} onChange={e => setNewCompName(e.target.value)} placeholder="e.g. Oracle India" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-700 mb-1">Job Role Title</label>
                          <input type="text" value={newCompRole} onChange={e => setNewCompRole(e.target.value)} placeholder="e.g. SDE Trainee" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-700 mb-1">CTC Package (LPA)</label>
                          <input type="number" step="0.1" required value={newCompCtc} onChange={e => setNewCompCtc(e.target.value)} placeholder="e.g. 14.5" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-700 mb-1">Tier Category</label>
                          <select value={newCompTier} onChange={e => setNewCompTier(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">
                            <option value="Super Dream">Super Dream (&gt;12 LPA)</option>
                            <option value="Dream">Dream (6 - 12 LPA)</option>
                            <option value="Mass">Mass Recruiters (&lt;6 LPA)</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-700 mb-1">Min CGPA Cutoff</label>
                          <input type="number" step="0.1" value={newCompMinCgpa} onChange={e => setNewCompMinCgpa(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs rounded-xl shadow-md transition">
                        Publish Drive Announcement
                      </button>
                    </form>
                  </div>

                  {/* Coordinator Email Authorizations */}
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 className="font-extrabold text-slate-900 text-sm border-b border-slate-100 pb-3">Student Placement Coordinators</h3>
                    <div className="space-y-3">
                      <div className="flex gap-2">
                        <input 
                          type="email" 
                          placeholder="coordinator@college.edu" 
                          value={newCoordinatorEmail} 
                          onChange={e => setNewCoordinatorEmail(e.target.value)}
                          className="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" 
                        />
                        <button 
                          onClick={() => {
                            if (newCoordinatorEmail.trim()) {
                              setCoordinatorEmails([...coordinatorEmails, newCoordinatorEmail.trim().toLowerCase()]);
                              setNewCoordinatorEmail('');
                            }
                          }}
                          className="px-4 py-2 bg-slate-900 text-white font-bold text-xs rounded-xl"
                        >
                          Add Email
                        </button>
                      </div>

                      <div className="space-y-1 max-h-48 overflow-y-auto">
                        {coordinatorEmails.length === 0 ? (
                          <p className="text-xs text-slate-400 italic">No coordinator emails added yet.</p>
                        ) : (
                          coordinatorEmails.map((email, idx) => (
                            <div key={idx} className="flex justify-between items-center p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
                              <span>{email}</span>
                              <button onClick={() => setCoordinatorEmails(coordinatorEmails.filter((_, i) => i !== idx))} className="text-rose-600 font-bold">Remove</button>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* LOGIN MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-black text-slate-900 text-base">Portal Login & Authentication</h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-3">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-700 mb-1">Select Role</label>
                    <select value={loginRole} onChange={e => setLoginRole(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold">
                      <option value="student">Student / Candidate</option>
                      <option value="admin">Placement Officer (Admin)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="student@college.edu or admin" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>

                  {loginRole === 'admin' && (
                    <div>
                      <label className="block text-[10px] font-bold text-slate-700 mb-1">Admin Security Password</label>
                      <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                    </div>
                  )}

                  {loginError && <p className="text-[11px] font-bold text-rose-600">{loginError}</p>}

                  <button type="submit" className="w-full py-3 bg-brand-600 text-white font-extrabold text-xs rounded-xl shadow-md hover:bg-brand-700 transition">
                    Sign In
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* SYLLABUS MODAL */}
          {syllabusModalCompany && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative">
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-black text-slate-900 text-lg">{syllabusModalCompany.name} - Syllabus & Rounds</h3>
                    <p className="text-xs text-brand-600 font-bold">{syllabusModalCompany.role} • ₹{syllabusModalCompany.ctc} LPA</p>
                  </div>
                  <button onClick={() => setSyllabusModalCompany(null)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <h4 className="font-extrabold text-slate-800 mb-1">Recruitment Rounds</h4>
                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                      {getSyllabusForCompany(syllabusModalCompany).rounds.map((r, i) => <li key={i}>{r}</li>)}
                    </ul>
                  </div>

                  <div>
                    <h4 className="font-extrabold text-slate-800 mb-1">Technical & Aptitude Topics</h4>
                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                      {getSyllabusForCompany(syllabusModalCompany).topics.map((t, i) => <li key={i}>{t}</li>)}
                    </ul>
                  </div>
                </div>

                <button onClick={() => setSyllabusModalCompany(null)} className="w-full py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl">
                  Close Syllabus
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
